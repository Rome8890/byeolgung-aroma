<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>세 장 심층 리딩 · 별궁시아 아로마타로</title>
  <meta name="description" content="세 장으로 만나는 내 마음의 이야기 — 별궁시아 아로마타로 심층 리딩">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #150a1c;
      --card-bg: rgba(33, 16, 39, 0.88);
      --gold: #f0d39c;
      --gold-dark: #b89358;
      --text: #f7eff6;
      --muted: #cfb9cc;
      --line: rgba(228, 207, 223, 0.16);
      --font-serif: "Noto Serif KR", serif;
      --font-display: "Cinzel Decorative", "Noto Serif KR", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg) url('assets/background.webp') repeat center top / 320px auto;
      color: var(--text);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
      line-height: 1.7;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 0.25em;
      color: var(--gold);
      margin-bottom: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .topic-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(240, 211, 156, 0.12);
      border: 1px solid rgba(240, 211, 156, 0.35);
      font-size: 13px;
      color: var(--gold);
    }

    .question-box {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
    }

    /* 카드 3장 그리드 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 32px 0 40px;
    }

    .card-slot {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      transition: transform 0.3s, border-color 0.3s;
    }

    .card-slot:hover {
      transform: translateY(-4px);
      border-color: rgba(240, 211, 156, 0.4);
    }

    .slot-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: block;
    }

    .card-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1.7;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(240, 211, 156, 0.25);
      background: #2a1530;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card-aroma {
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      color: #eed6ec;
      border: 1px solid rgba(228, 207, 223, 0.1);
      margin-top: 10px;
    }

    .card-aroma strong {
      color: var(--gold);
      display: block;
      margin-bottom: 2px;
    }

    /* 종합 리딩 섹션 */
    .reading-detail {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 28px;
      margin-bottom: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .reading-detail h2 {
      font-size: 20px;
      color: var(--gold);
      margin-bottom: 18px;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .reading-section {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px dashed rgba(228, 207, 223, 0.15);
    }

    .reading-section:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .reading-section h3 {
      font-size: 15px;
      color: #eed6ec;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reading-section h3 span {
      color: var(--gold);
    }

    .reading-section p {
      font-size: 14px;
      color: #dfcedd;
      line-height: 1.8;
    }

    .wish-box {
      margin-top: 24px;
      padding: 18px 20px;
      background: linear-gradient(135deg, rgba(240, 211, 156, 0.1), rgba(184, 147, 88, 0.05));
      border: 1px solid rgba(240, 211, 156, 0.35);
      border-radius: 12px;
      text-align: center;
    }

    .wish-box span {
      font-size: 12px;
      color: var(--gold);
      display: block;
      margin-bottom: 4px;
    }

    .wish-box strong {
      font-size: 16px;
      color: #fff;
    }

    /* 마음 기록 작성 영역 */
    .journal-box {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 32px;
    }

    .journal-box h3 {
      font-size: 16px;
      color: var(--gold);
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f0d39c, #d1a868);
      color: #210e23;
      margin-top: 12px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #fcebc7, #dfb877);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      color: #fff;
    }

    /* 상태/로딩 */
    #loading-state {
      text-align: center;
      padding: 60px 20px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(240, 211, 156, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 680px) {
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .card-img-wrap {
        width: 170px;
      }
      .reading-detail, .journal-box {
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">BYEOLGUNG SIA · AROMA TAROT</div>
      <h1>세 장의 이야기로 만나는 내면의 나</h1>
      <div id="display-topic" class="topic-badge">오늘의 심층 리딩</div>
      <div id="display-question" class="question-box"></div>
    </header>

    <!-- 로딩 상태 -->
    <div id="loading-state">
      <div class="spinner"></div>
      <h2 style="font-size: 18px; color: var(--gold); margin-bottom: 8px;">결제를 승인하고 운명의 카드를 열고 있습니다...</h2>
      <p style="font-size: 13px; color: var(--muted);">잠시만 기다려주시면 세 장의 카드가 펼쳐집니다.</p>
    </div>

    <!-- 결과 상태 -->
    <div id="result-state" style="display: none;">
      <!-- 카드 3장 -->
      <div class="cards-grid" id="cards-container"></div>

      <!-- 종합 리딩 -->
      <section class="reading-detail">
        <h2>✦ 별궁시아 종합 심층 리딩 ✦</h2>
        <div id="reading-sections"></div>
        <div class="wish-box" id="wish-container"></div>
      </section>

      <!-- 마음 기록 작성 -->
      <section class="journal-box">
        <h3>오늘 만난 세 장의 카드와 마음 남기기</h3>
        <textarea id="journal-input" placeholder="세 장의 카드를 보고 마음에 와닿은 생각이나 다짐을 한 줄 적어보세요."></textarea>
        <button class="btn btn-primary" id="btn-save-journal">이 세 장의 리딩 저장하기</button>
        <div id="save-msg" style="font-size:12px; color:var(--gold); margin-top:8px; text-align:center;"></div>
        <a href="/" class="btn btn-secondary">별궁시아 홈으로 돌아가기</a>
      </section>
    </div>
  </div>

  <script>
    // 22장 아로마타로 마스터 데이터
    const cards = [
      { id: 0, name: "헤르메스", title: "바보", key: "시작 · 호기심 · 자유", oil: "와일드 오렌지", scent: "밝고 달콤한 감귤 향", text: "모든 답을 알아야 시작할 수 있는 것은 아닙니다. 오늘 시도할 작은 일 하나를 골라보세요.", wish: "나는 작은 시작을 허락합니다.", image: "assets/00.webp", symbol: "✧" },
      { id: 1, name: "헤파이스토스", title: "마법사", key: "창조 · 집중 · 손끝의 힘", oil: "로즈마리", scent: "맑고 또렷한 허브 향", text: "필요한 것은 이미 당신의 손안에 있습니다. 가진 재료들을 믿고 묵묵히 빚어보세요.", wish: "나는 이미 충분한 도구를 지니고 있습니다.", image: "assets/01.webp", symbol: "⚒" },
      { id: 2, name: "페르세포네", title: "여사제", key: "직관 · 침묵 · 내면의 지혜", oil: "클라리 세이지", scent: "차분하고 신비로운 풀 향", text: "세상의 소란에서 한 걸음 물러나 침묵 속에 머물러보세요. 마음 깊은 곳의 답이 들립니다.", wish: "나는 내 고요한 직관을 신뢰합니다.", image: "assets/02.webp", symbol: "☽" },
      { id: 3, name: "데메테르", title: "여황제", key: "풍요 · 돌봄 · 온기", oil: "제라늄", scent: "부드럽고 우아한 꽃 향", text: "자신을 먼저 따뜻하게 품어줄 때 삶의 풍요가 피어납니다. 스스로에게 가장 너그러워지세요.", wish: "나는 나를 온전히 보살핍니다.", image: "assets/03.webp", symbol: "❦" },
      { id: 4, name: "제우스", title: "황제", key: "질서 · 책임 · 리더십", oil: "시더우드", scent: "깊고 묵직한 나무 향", text: "흔들리는 상황에서도 당신만의 원칙과 중심을 지키세요. 굳건한 뿌리가 폭풍을 견딥니다.", wish: "나는 내 삶의 주권을 잡습니다.", image: "assets/04.webp", symbol: "⚡" },
      { id: 5, name: "케이론", title: "교황", key: "가르침 · 치유 · 신뢰", oil: "프랑킨센스", scent: "고귀하고 평온한 송진 향", text: "상처받은 자만이 타인을 진정으로 치유할 수 있습니다. 겪어온 아픔을 지혜로 바꾸어보세요.", wish: "나의 상처는 나를 성장시키는 빛입니다.", image: "assets/05.webp", symbol: "☤" },
      { id: 6, name: "에로스와 프시케", title: "연인", key: "선택 · 사랑 · 조화", oil: "일랑일랑", scent: "매혹적이고 달콤한 플로럴", text: "진정한 사랑은 의심을 넘어 믿음을 건넬 때 완성됩니다. 가슴이 뛰는 선택을 믿어보세요.", wish: "나는 마음이 이끄는 길을 선택합니다.", image: "assets/06.webp", symbol: "♥" },
      { id: 7, name: "아레스", title: "전차", key: "전진 · 돌파 · 의지", oil: "페퍼민트", scent: "상쾌하고 강렬한 박하 향", text: "두려움을 딛고 한 발을 내딛을 때 길은 열립니다. 머뭇거리지 말고 목표를 향해 나아가세요.", wish: "나는 거침없이 앞으로 나아갑니다.", image: "assets/07.webp", symbol: "⚔" },
      { id: 8, name: "헤라클레스", title: "힘", key: "인내 · 부드러운 힘 · 용기", oil: "라벤더", scent: "포근하고 은은한 허브 꽃 향", text: "가장 거친 야수도 따뜻한 다정함 앞에서는 온순해집니다. 내면의 불안을 부드럽게 감싸안으세요.", wish: "부드러움이 가장 큰 힘입니다.", image: "assets/08.webp", symbol: "🦁" },

      { id: 10, name: "모이라이", title: "운명의 수레바퀴", key: "전환 · 흐름 · 수용", oil: "베르가못", scent: "생기 넘치는 상큼한 감귤 향", text: "계절이 바뀌듯 모든 상황도 순환합니다. 억지로 붙잡지 말고 새로운 흐름을 타세요.", wish: "나는 삶의 새로운 흐름을 반깁니다.", image: "assets/10.webp", symbol: "☸" },

      { id: 12, name: "프로메테우스", title: "매달린 사람", key: "관점의 전환 · 헌신 · 기다림", oil: "마조람", scent: "따뜻하고 스파이시한 풀 향", text: "세상을 거꾸로 바라볼 때 비로소 보이는 진실이 있습니다. 지금의 멈춤은 더 큰 도약을 위한 쉼입니다.", wish: "나는 다른 시선으로 세상을 바라봅니다.", image: "assets/12.webp", symbol: "🕯" },
      { id: 13, name: "하데스", title: "죽음", key: "끝과 시작 · 정화 · 탈바꿈", oil: "사이프러스", scent: "청명하고 시원한 편백 나무 향", text: "낡은 잎이 떨어져야 새싹이 돋아납니다. 끝난 인연과 미련을 홀가분하게 보내주세요.", wish: "나는 과거를 보내고 새롭게 태어납니다.", image: "assets/13.webp", symbol: "✦" },
      { id: 14, name: "아이리스", title: "절제", key: "조화 · 정화 · 순환", oil: "유칼립투스", scent: "맑고 깨끗하게 트이는 숲 향", text: "극단을 피하고 양쪽의 에너지를 부드럽게 섞으세요. 중용의 미덕이 평화를 가져옵니다.", wish: "내 삶은 완벽한 조화를 이룹니다.", image: "assets/14.webp", symbol: "🌈" },
      { id: 15, name: "판", title: "악마", key: "욕망 · 집착 · 해방", oil: "패출리", scent: "원초적이고 깊은 흙 내음", text: "나를 옭아맨 쇠사슬은 사실 느슨하게 걸쳐져 있을 뿐입니다. 언제든 스스로 벗어날 수 있습니다.", wish: "나는 나를 묶고 있던 굴레에서 벗어납니다.", image: "assets/15.webp", symbol: "🔥" },
      { id: 16, name: "포세이돈", title: "탑", key: "격변 · 각성 · 진실의 폭로", oil: "티트리", scent: "강렬하고 서늘한 정화의 향", text: "허약하게 쌓아 올린 가짜 성이 무너지는 것은, 더 단단한 진짜 성을 짓기 위한 축복입니다.", wish: "나는 변화를 두려워하지 않고 진실을 맞이합니다.", image: "assets/16.webp", symbol: "⚡" },
      { id: 17, name: "아스테리아", title: "별", key: "희망 · 영감 · 치유", oil: "네롤리", scent: "영롱하고 은은한 오렌지 꽃 향", text: "어둠이 깊을수록 별은 더욱 영롱하게 빛납니다. 당신의 미래는 반짝이는 희망으로 가득 차 있습니다.", wish: "나의 미래는 밝은 빛으로 인도됩니다.", image: "assets/17.webp", symbol: "★" },
      { id: 18, name: "헤카테", title: "달", key: "무의식 · 꿈 · 안개 속 진실", oil: "카모마일", scent: "사과처럼 달콤하고 온화한 허브 향", text: "안개 낀 밤길이라도 당신의 영혼은 길을 알고 있습니다. 막연한 불안을 지나 아침을 맞이하세요.", wish: "나는 밤의 두려움을 건너 밝은 새벽으로 갑니다.", image: "assets/18.webp", symbol: "☾" },
      { id: 19, name: "아폴론", title: "태양", key: "생명력 · 환희 · 명확함", oil: "레몬", scent: "눈부시게 화사한 시트러스 향", text: "모든 의문이 해소되고 눈부신 태양이 떠오릅니다. 마음껏 웃고 축복을 온몸으로 누리세요.", wish: "나는 언제나 태양처럼 눈부시게 빛납니다.", image: "assets/19.webp", symbol: "☀" },
      { id: 20, name: "헤르메스 프시코폼포스", title: "심판", key: "부활 · 각성 · 소명", oil: "멜리사", scent: "청량하고 상큼한 레몬밤 향", text: "오래 잠들어 있던 당신의 진짜 영혼을 깨우는 나팔 소리가 울립니다. 주저 말고 일어나세요.", wish: "나는 진정한 나 자신으로 다시 태어납니다.", image: "assets/20.webp", symbol: "📯" },
      { id: 21, name: "가이아", title: "세계", key: "완성 · 통합 · 영원한 평화", oil: "로즈", scent: "우아하고 고귀한 장미 꽃 향", text: "하나의 커다란 여정이 아름답게 완성되었습니다. 이제 더 넓은 세상을 향해 평화롭게 춤추세요.", wish: "나는 온전하며, 세상과 하나로 연결되어 있습니다.", image: "assets/21.webp", symbol: "🌐" }
    ];

    // URL 파라미터 및 세션 복원
    const params = new URLSearchParams(window.location.search);
    const paymentKey = params.get('paymentKey');
    const orderId = params.get('orderId');
    const amount = params.get('amount');

    const topic = sessionStorage.getItem('byeolgung_reading_topic') || '오늘의 운세';
    const question = sessionStorage.getItem('byeolgung_reading_question') || '';

    document.getElementById('display-topic').textContent = topic;
    if (question) {
      document.getElementById('display-question').textContent = `“${question}”`;
    }

    let selectedCards = [];

    async function initReading() {
      // 1. 서버 결제 승인 API 호출 (Vercel Serverless Function)
      try {
        if (paymentKey && orderId && amount) {
          const res = await fetch('/api/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentKey, orderId, amount })
          });
          const json = await res.json();
          if (!res.ok) {
            console.warn('Payment API warning:', json);
          }
        }
      } catch (err) {
        console.warn('Confirm request error (fallback to client preview):', err);
      }

      // 2. 22장 중 중복 없이 3장 무작위 추천
      const indices = [];
      while (indices.length < 3) {
        const r = Math.floor(Math.random() * cards.length);
        if (!indices.includes(r)) indices.push(r);
      }
      selectedCards = indices.map(idx => cards[idx]);

      // 3. 화면 렌더링
      renderCards(selectedCards);
      renderReadings(selectedCards, topic, question);

      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('result-state').style.display = 'block';
    }

    function renderCards(three) {
      const labels = ['1. 현재 상황 (Present)', '2. 내면의 도전 & 장애물 (Challenge)', '3. 별궁시아의 조언 & 처방 (Advice)'];
      const container = document.getElementById('cards-container');
      container.innerHTML = three.map((c, i) => `
        <div class="card-slot">
          <span class="slot-label">${labels[i]}</span>
          <div class="card-img-wrap">
            <img src="${c.image}" alt="${c.name}">
          </div>
          <div class="card-name">${c.symbol} ${c.name}</div>
          <div class="card-sub">${c.title} · ${c.key}</div>
          <div class="card-aroma">
            <strong>🌿 처방 아로마: ${c.oil}</strong>
            ${c.scent}
          </div>
        </div>
      `).join('');
    }

    function renderReadings(three, topic, question) {
      const c1 = three[0], c2 = three[1], c3 = three[2];
      const sections = document.getElementById('reading-sections');
      sections.innerHTML = `
        <div class="reading-section">
          <h3><span>1.</span> 지금 나의 에너지와 상황 — [${c1.name}]</h3>
          <p>현재 당신은 <strong>'${c1.key}'</strong>의 에너지를 통과하고 있습니다. ${c1.text}</p>
        </div>
        <div class="reading-section">
          <h3><span>2.</span> 마주한 내면의 갈등과 주의할 점 — [${c2.name}]</h3>
          <p>마음속의 걸림돌이나 망설임은 <strong>'${c2.title}'</strong>의 카드에서 비롯되고 있습니다. 무리하게 저항하기보다 <em>${c2.text}</em>의 지혜를 마음에 품어보세요.</p>
        </div>
        <div class="reading-section">
          <h3><span>3.</span> 별궁시아의 조언과 추천 향기 — [${c3.name}]</h3>
          <p>가장 명확한 해답은 <strong>'${c3.name}'</strong>이 건네는 메시지에 있습니다. ${c3.text} 함께하는 <strong>${c3.oil} (${c3.scent})</strong>의 향기가 당신의 결정을 단단하게 지탱해 줄 것입니다.</p>
        </div>
      `;

      document.getElementById('wish-container').innerHTML = `
        <span>오늘을 위한 별궁시아의 기원</span>
        <strong>“${c3.wish}”</strong>
      `;
    }

    // 일기 저장
    document.getElementById('btn-save-journal').onclick = () => {
      const note = document.getElementById('journal-input').value.trim();
      const saveMsg = document.getElementById('save-msg');
      try {
        const raw = localStorage.getItem('sia-aroma-journal');
        const list = raw ? JSON.parse(raw) : [];
        list.unshift({
          id: 'three_' + Date.now(),
          type: 'three',
          topic: topic,
          question: question,
          card: selectedCards[0].id,
          cards: selectedCards.map(c => c.id),
          note: note || '세 장 심층 리딩을 간직했습니다.',
          date: new Date().toISOString()
        });
        localStorage.setItem('sia-aroma-journal', JSON.stringify(list));
        saveMsg.textContent = '✓ 마음 기록에 안전하게 저장되었습니다! 메인 화면의 마음 기록 탭에서 언제든 확인하실 수 있어요.';
        document.getElementById('btn-save-journal').disabled = true;
      } catch (e) {
        saveMsg.textContent = '브라우저 저장 공간 문제로 저장하지 못했습니다.';
      }
    };

    window.addEventListener('DOMContentLoaded', initReading);
  </script>
</body>
</html>
