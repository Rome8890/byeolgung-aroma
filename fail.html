<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>결제 안내 · 별궁시아 아로마타로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #150a1c;
      --card-bg: rgba(33, 16, 39, 0.92);
      --gold: #f0d39c;
      --text: #f7eff6;
      --muted: #cfb9cc;
      --line: rgba(228, 207, 223, 0.16);
      --font-serif: "Noto Serif KR", serif;
      --font-display: "Cinzel Decorative", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg) url('assets/background.webp') repeat center top / 320px auto;
      color: var(--text);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.7;
    }

    .fail-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    .fail-icon {
      font-size: 40px;
      color: #e49bb4;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .reason-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 12.5px;
      color: #dfcedd;
      margin-bottom: 24px;
      text-align: left;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f0d39c, #d1a868);
      color: #210e23;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .btn-secondary:hover {
      border-color: var(--gold);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="fail-card">
    <div class="fail-icon">✦</div>
    <h1>결제가 진행되지 않았습니다</h1>
    <p class="desc">결제 진행 중 창을 닫으셨거나, 카드사 통신 또는 잔액 문제로 결제가 완료되지 않았습니다.</p>
    
    <div class="reason-box">
      <div><strong>오류 사유:</strong> <span id="error-message">고객 취소 또는 결제 실패</span></div>
      <div style="margin-top: 4px; font-size: 11px; color: #9d839c;"><strong>오류 코드:</strong> <span id="error-code">PAY_PROCESS_CANCELED</span></div>
    </div>

    <a href="/" class="btn btn-primary">별궁시아 홈으로 돌아가기</a>
    <a href="https://pf.kakao.com/_pQxgMX" target="_blank" rel="noopener" class="btn btn-secondary">카카오톡 고객센터 문의</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const message = params.get('message');

    if (code) document.getElementById('error-code').textContent = code;
    if (message) document.getElementById('error-message').textContent = decodeURIComponent(message);
  </script>
</body>
</html>
